[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "neural-racing-lab"
version = "0.1.0"
description = "Learning autonomous driving with reinforcement learning, one verified phase at a time"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gymnasium[box2d]==1.4.0",
    "numpy>=2.1,<3",
    "imageio[ffmpeg]>=2.37,<3",
]

[project.optional-dependencies]
torch = ["torch==2.12.1"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
nrl-random = "neural_racing_lab.random_agent:main"
nrl-manual = "neural_racing_lab.manual_control:main"
nrl-check = "neural_racing_lab.diagnostics:main"

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:builtin type Swig.*has no __module__ attribute:DeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
